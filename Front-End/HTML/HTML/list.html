<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>

    <!-- 3 types of List -->

    <!-- Unordered List -->
    <!-- type : circle,desc (by default its circle)-->
    <ul type="square">
        <li>List Item 1</li>
        <li>List Item 2</li>
        <li>List Item 3</li>
        <li>List Item 4</li>
        <li>List Item 5</li>
    </ul>

    <hr>
    <!-- Ordered List -->
    <!-- type : 1,I,i,A,a (by default its 1)-->
    <ol type="i">
        <li>List Item 1</li>
        <li>List Item 2</li>
        <li>List Item 3</li>
        <li>List Item 4</li>
        <li>List Item 5</li>
    </ol>

    <hr>
    <!-- Ordered List -->
    <!-- This list is not-in use-->
    <dl>
        <dt>Coffee</dt>
        <dd>Cold</dd>
        <dd>Hot</dd>
        <dt>Tea</dt>
        <dd>Cold</dd>
        <dd>Hot</dd>
    </dl>


</body>

</html>
