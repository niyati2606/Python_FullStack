<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>

<body>
    <canvas id="canvas"></canvas>

    <script>
        var cnv = document.getElementById("canvas")
        var big = cnv.getContext('2d')
        big.fillStyle = 'red';
        big.fillRect(0, 0, 130, 70);

        big.stroke();
    </script>
</body>

</html>
