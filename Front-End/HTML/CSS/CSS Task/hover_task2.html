<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Task 2</title>
    <style>
        .main {
            position: relative;
            width: 350px;
            height: 200px;
            margin: auto;
            overflow: hidden;
        }

        .img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(141, 146, 144, 0.6);
            color: black;
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: bold;
            transform: scale(0);
            transition: transform 0.8s;
        }

        .main:hover .overlay {
            transform: scale(1);
        }
    </style>
</head>

<body>
    <div class="main">
        <img src="../../images/css_task1.jpg" alt="CSS task image" class="img">
        <div class="overlay">
            Beautiful View
        </div>
    </div>
</body>

</html>
