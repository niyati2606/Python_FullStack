<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius CSS</title>
    <style>
        .main {
            height: 200px;
            width: 200px;
            border: 8px double blue;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="main">
        box radius
    </div>

    <h1 style="border: 4px solid; border-radius: 30px;">Simple Radius</h1>
    <h1 style="border: 4px solid; border-top-left-radius: 30px;">Top-Left Radius</h1>
    <h1 style="border: 4px solid; border-top-right-radius: 30px;">Top Right Radius</h1>
    <h1 style="border: 4px solid; border-bottom-left-radius: 30px;">bottom-Left Radius</h1>

</body>

</html>
