<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color CSS</title>
</head>
<body>
    <h1 style="background-color: antiquewhite;">Normal Color</h1>

    <!--#000 - black and #fff - white-->
    <h1 style="background-color: #b07575;">Hexa Color</h1>

    <!--RGB Color (0 t0 255)-->
    <h1 style="background-color: rgb(144, 96, 193);">RGB Color</h1>

    <!--RGBA color alpha range 0 to 1-->
    <h1 style="background-color : rgba(155, 185, 11, 0.5)">RGBA Color</h1>

    <!--HSL color-->
    <h1 style="background-color: hsl(120, 81%, 32%);">HSL Color</h1>

    <!--HSLA color-->
    <h1 style="background-color: hsl(322, 21%, 25%, 0.6);">HSLA Color</h1>

</body>
</html>
