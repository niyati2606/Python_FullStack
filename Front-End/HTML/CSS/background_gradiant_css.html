<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Gradient Color</title>
    <style>
        .linearGradient {
            height: 300px;
            width: 300px;
            background: linear-gradient(skyblue, aquamarine, orange);
        }

        .linearGradientTop {
            height: 300px;
            width: 300px;
            background: linear-gradient(to top,skyblue, aquamarine, orange);
        }

        .linearGradientRight {
            height: 300px;
            width: 300px;
            background: linear-gradient(to right,skyblue, aquamarine, orange);
        }

        .linearGradientLeft {
            height: 300px;
            width: 300px;
            background: linear-gradient(to left,skyblue, aquamarine, orange);
        }

        .radialGradient {
            height: 300px;
            width: 300px;
            background: radial-gradient(pink, gray,orange);
        }
    </style>
</head>
<body>
    <div class="linearGradient">Linear Gradient</div>
    <hr>
    <div class="linearGradientTop">Linear Gradient from Top</div>
    <hr>
    <div class="linearGradientRight">Linear Gradient from Right</div>
    <hr>
    <div class="linearGradientLeft">Linear Gradient from Left</div>
    <hr>
    <div class="radialGradient">Radial Gradient</div>
</body>
</html>
