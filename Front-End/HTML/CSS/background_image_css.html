<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Image CSS</title>
    <style>
        .main{
            height: 300px;
            background-image: url("https://jenmulligandesign.com/wp-content/uploads/2017/04/stockvault-surfer-at-sunset-free-stock-photos.jpg");
            background-repeat: no-repeat;
            background-size: contain;
        }
    </style>
</head>
<body>
    <div class="main">
        Background Image Example
    </div>
    <hr>
    <!-- Foreground image-->
     <img src="https://jenmulligandesign.com/wp-content/uploads/2017/04/pexels-beach-tropical-scene-free-stock-photo.jpg" width="400px alt="no-image">

</body>
</html>
