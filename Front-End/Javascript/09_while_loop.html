<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Loop</title>
</head>
<body>
    
    <script>

        //while loop - entry control loop (check condition at enter)
        let i = 1
        while(i <= 10){
            console.log(i)
            i++
        }

         //do while loop - exit control loop (check condition after execution of variable value)
        let n = 1
        do{
            console.log(n)
            n++
        }while(n <= 10)
    </script>

</body>
</html>
