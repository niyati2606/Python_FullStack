<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Button Event</title>
</head>

<body>
    <h1 id="h1">Hello javascript</h1>

    <button onclick="singleClick()">Single Click</button>

    <h1 id="h1_dbclick"></h1>

    <button ondblclick="doubleClick()">Double Click</button>

    <script>

        function singleClick() {
            console.log("Hello This is Demo of JS")
            //document.write("Hello This is Demo of JS")
            document.getElementById("h1").innerText = "Hello this is single click demo"
        }

        function doubleClick() {
            console.log("Hello This is Demo")
            document.getElementById("h1_dbclick").innerText = "Hello this is double click demo"
        }

    </script>
</body>

</html>
