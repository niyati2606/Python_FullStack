<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Pattern</title>
</head>

<body>

    <script>
        let num = 1
        for (let r = 1; r <= 5; r++) {
            for (let c = 1; c <= r; c++) {
                document.writeln(num + " ")
                num++
            }
            document.writeln("<br>")
        }
    </script>

</body>

</html>
