<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Types</title>
</head>

<body>
    <!--
        There are 2 types of DataTypes 
        1) Primitive
        2) Non-Primitive

        1)Primitive : 
            - Number
            - String
            - boolean
            - null
            - undefined
            - bigINT
            - symbols

        2) Non-Primitve
            - Array
            - object
    -->

    <script>

        //Number
        let num = 5
        console.log(num)
        console.log(typeof(num))

        //string
        let str = "Niya"
        console.log(str)
        console.log(typeof(str))

        //Boolean
        let bool = true
        console.log(bool)
        console.log(typeof(bool))

        //null
        let data = null
        console.log(data)
        console.log(typeof(data))

        //undefined
        let def
        console.log(def)
        console.log(typeof(def))

        //BigINT
        let bigData = 12358486
        console.log(bigData)
        console.log(typeof(bigData))

    </script>
</body>

</html>
