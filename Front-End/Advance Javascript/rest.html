<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest function</title>
</head>
<body>
    <!-- 
    allows a function to accept an indefinite number of arguments as a single, true array
    -->

    <script>

        function sum(...numbers){
            let total = 0
            for(let n in numbers){
                total = total + numbers[n]
            }
            return total
        }

        console.log(sum(33,5,1,7,44,3))

    </script>
</body>
</html>
