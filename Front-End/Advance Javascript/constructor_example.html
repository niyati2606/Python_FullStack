<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>constructor example</title>
</head>
<body>
    
    <script>

        class ConstructorExample{
            constructor( num1, num2){
                this.num1 = num1
                this.num2 = num2
            }

            sum(){
                console.log("Sum :", this.num1 + this.num2)
            }

            mul(){
                console.log(`Mul : ${this.num1 * this.num2}`)
            }
        }

        let constEx = new ConstructorExample(20,8)
        constEx.sum()
        constEx.mul()

    </script>

</body>
</html>
