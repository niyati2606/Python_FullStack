<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread function</title>
</head>

<body>
    <!-- 
    allows an iterable, such as an array, string, or object, to be expanded into individual elements or properties
    -->

    <script>

        let arr = [1, 2, 3, 4, 5]
        let arr1 = [6, 7, 8, 9, 10]

        let array = [...arr, ...arr1]
        console.log(array)

    </script>
</body>

</html>
