<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date</title>
</head>

<body>

    <script>

        let info = new Date()
        console.log(info)

        console.log(info.getDate())
        console.log(info.getDay())
        console.log(info.getFullYear())
        console.log(info.getHours())
        console.log(info.getMinutes())

        //set
        info.setDate(23)
        console.log(info.getDate())
        info.setMonth(2)
        console.log(info.getMonth())
        info.setFullYear(2023)
        console.log(info.getFullYear())

    </script>

</body>

</html>
