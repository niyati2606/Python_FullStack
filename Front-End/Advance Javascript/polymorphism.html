<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymorphism</title>
</head>

<body>
    <!-- 
        Overloading: Same class, same function name, different parameters → Compile-time polymorphism.
        Overriding: Parent and child classes, same function name, same parameters → Runtime polymorphism. 
    -->
    <script>
        // class A {
        //     display(a) {
        //         console.log("A value : ", a)
        //     }
        //     display(a, b) {
        //         console.log("sum : ", a + b)
        //     }
        //     display(a, b) {
        //         console.log("sub : ", a - b)
        //     }
        // }

        // const user = new A
        // console.log(user)
        // user.display(20, 30)

        class A {
            display() {
                console.log("A class")
            }
        }
        class B extends A {
            display() {
                console.log("B class")
            }
        }
        class C extends B {
            display() {
                console.log("C class")
            }
        }

        // const user = new C;
        // user.display()
        // user.display()
        // console.log(user)

        const data = [new A, new B, new C]
        console.log(data)
        data.forEach((test) => {
            test.display()
        })
    </script>

</body>

</html>
