<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Back</title>
</head>

<body>
    <!-- 
    a function passed into another function as an argument, which is then executed (or "called back") 
    inside the outer function to complete a routine or action. 
    -->

    <script>

        function callbakcDemo(){
            console.log("Callback Example")
        }

        function outsideCallback(){
            callbakcDemo()
        }

        outsideCallback()

        setInterval(callbakcDemo,1000)
        setTimeout(outsideCallback,5000)

    </script>
</body>

</html>
