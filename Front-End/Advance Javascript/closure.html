<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure</title>
</head>

<body>
    <!-- 
    closure : a function that remembers and accesses variables from its outer scope, even after the outer function has finished executing
    -->
    <script>
         let x = 10

        function closureDemo(){
            let x = 20
            console.log("x : ",x);
        }
        console.log("X outside :",x)
      
        closureDemo()
    </script>
</body>

</html>
