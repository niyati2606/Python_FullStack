<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <table class="table table-dark">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">name</th>
                    <th scope="col">email</th>
                    <th scope="col">city</th>
                    <th scope="col">Company
                    </th>
                </tr>
            </thead>
            <tbody class="data">

            </tbody>
        </table>
    </div>

    <script>

        try {
            fetch("https://jsonplaceholder.typicode.com/users", {
                method: "GET"
            })
                .then((res) => {
                    return res.json()
                })

                .then((res) => {
                    console.log(res)
                    res.forEach((val, index) => {
                        console.log(val)

                        let tbody = document.querySelector(".data")

                        let trow = tbody.insertRow();

                        let idcell = trow.insertCell(0)
                        let namecell = trow.insertCell(1)
                        let emailcell = trow.insertCell(2)
                        let citycell = trow.insertCell(3)
                        let companycell = trow.insertCell(4)


                        idcell.textContent = val.id
                        namecell.textContent = val.name
                        emailcell.textContent = val.email
                        citycell.textContent = val.address.city
                        companycell.textContent = val.company.name
                    })
                })
        } catch (err) {
            console.log(err)
        }

    </script>
</body>

</html>
