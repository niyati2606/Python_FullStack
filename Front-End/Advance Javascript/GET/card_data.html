<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card JSON</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #f5f6f8;
        }

        .page-title {
            font-weight: 600;
            margin: 2rem 0 1.5rem;
        }

        .product-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .product-img-wrap {
            background-color: #fff;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .product-img-wrap img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            display: -webkit-box;
            overflow: hidden;
            min-height: 2.6em;
        }

        .card-text {
            font-size: 0.875rem;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="page-title text-center">Our Products</h2>
        <div class="row g-4 data">

        </div>
    </div>

    <script>

        fetch("https://fakestoreapi.com/products", {
            method: "GET"
        })
            .then((response) => {
                return response.json()
            })
            .then((response) => {
                console.log(response)

                let htmlData = response.map((value, index) => {
                    return (
                        `
                        <div class="col-sm-6 col-md-4 col-lg-3">
                            <div class="card product-card h-100">
                                <div class="product-img-wrap">
                                    <img src="${value.image}" alt="${value.title}">
                                </div>
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title">${value.title}</h5>
                                    <p class="card-text">${value.description.slice(0, 70)}...</p>
                                    <div class="d-flex justify-content-between align-items-center mt-auto">
                                        <span class="fw-bold">$${value.price}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `
                    )
                })
                document.querySelector(".data").innerHTML = htmlData.join("")
            })
            .catch((err) => {
                console.log(err)
            })

    </script>
</body>

</html>
