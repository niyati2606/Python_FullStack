<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Data from JSON File</title>
</head>
<body>
    
    <script>
         fetch("data.json",{
            method:"GET"
        })
        .then((data)=>{
            // json convert object/array
            return data.json()
        })
        .then((data)=>{
            console.log("Users Data : ",data)
        })
        .catch((err)=>{
            console.log("data not found",err)
        })
    </script>

</body>
</html>
