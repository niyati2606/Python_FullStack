<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encapsulation and Abstraction</title>
</head>
<body>
    
    <script>

        function Person(name, age){

            // private variable declare using _
            let _name = name
            let _age = age

            // encapsulation : method
           this.getName=()=>{
                return _name
            }
            this.getAge=()=>{
                return _age;
            }

            this.setAge = (newAge) =>{
                return _age = newAge
            }
        }

        const user = new Person("Niya",26)
       // console.log(user)
       console.log(user._name)
        console.log(user._age)
        console.log(user.getName())
        console.log(user.getAge())
        console.log(user.setAge(25))
        console.log(user.getAge())
    </script>

</body>
</html>
