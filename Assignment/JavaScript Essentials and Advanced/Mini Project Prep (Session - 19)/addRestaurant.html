<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Add Restaurant</h1>
        <div class="card p-4 shadow">
            <form id="restaurantForm">
                <div class="mb-3"> <label class="form-label">Restaurant Name</label> <input type="text"
                        id="restaurantName" class="form-control" placeholder="Enter restaurant name" required> </div>
                <div class="mb-3"> <label class="form-label">Cuisine</label> <input type="text" id="cuisine"
                        class="form-control" placeholder="e.g. Indian, Chinese, Italian" required> </div>
                <div class="mb-3"> <label class="form-label">Rating</label> <input type="number" id="rating"
                        class="form-control" placeholder="Enter rating" min="1" max="5" step="0.1" required> </div>
                <button type="submit" class="btn btn-danger"> Add Restaurant </button>
            </form>
        </div>
        <h2 class="mt-5">Restaurants</h2>
        <div id="restaurantList" class="row mt-3"> </div>
    </div>

    <script>
        // Array to store restaurants
        let restaurants = [];

        // Get form and list
        const restaurantForm = document.getElementById("restaurantForm");
        const restaurantList = document.getElementById("restaurantList");

        // Add restaurant
        restaurantForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("restaurantName").value;
            const cuisine = document.getElementById("cuisine").value;
            const rating = document.getElementById("rating").value;

            // Create restaurant object
            const restaurant = {
                name: name,
                cuisine: cuisine,
                rating: rating
            };

            // Store in array
            restaurants.push(restaurant);

            console.log(restaurants);

            // Display restaurants
            displayRestaurants();

            // Clear form
            restaurantForm.reset();
        });

        // Display restaurants
        function displayRestaurants() {
            restaurantList.innerHTML = "";

            restaurants.forEach(function (restaurant) {
                restaurantList.innerHTML += `
                <div class="col-md-4 mb-3">
                    <div class="card shadow h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                ${restaurant.name}
                            </h5>

                            <p class="card-text">
                                Cuisine: ${restaurant.cuisine}
                            </p>

                            <p class="card-text">
                                ⭐ ${restaurant.rating}
                            </p>
                        </div>
                    </div>
                </div>
            `;
            });
        }
    </script>

</body>

</html>
