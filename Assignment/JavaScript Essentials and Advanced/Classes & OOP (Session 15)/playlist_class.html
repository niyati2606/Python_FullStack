<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
</head>

<body>
    <h1>Spotify style Playlist</h1>

    <script>
        class Playlist {
            constructor(name, songs) {
                this.name = name;
                this.songs = songs;
            }
        }

        const chillVibes = new Playlist("Chill Vibes", [
            "Perfect",
            "Until I Found You",
            "Night Changes"
        ]);

        console.log(chillVibes);
        console.log("Playlist:", chillVibes.name);
        console.log("Songs:", chillVibes.songs);
    </script>
</body>

</html>
