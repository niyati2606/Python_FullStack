<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add To Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4 ">🛒 Shopping Cart</h2>

        <!-- Product -->
        <div class="card p-3 shadow-sm mx-auto" style="max-width: 400px;">
            <h4>Wireless Headphones</h4>
            <p class="text-muted">Price: ₹1,999</p>

            <button id="addCartBtn" class="btn btn-primary">
                Add to Cart
            </button>
        </div>

        <!-- Cart Section -->
        <div class="card mt-4 p-3 mx-auto" style="max-width: 400px;">
            <h4>🛒 Cart Items</h4>

            <ul id="cart" class="list-group">
            </ul>
        </div>

    </div>

    <script>
        function addToCart() {

            const productName = "Wireless Headphones";

            const cart = document.querySelector("#cart");

            const item = document.createElement("li");

            item.className = "list-group-item";

            item.textContent = productName;

            cart.appendChild(item);
        }

        // Select the button
        const addCartBtn = document.querySelector("#addCartBtn");

        // Attach click event
        addCartBtn.addEventListener("click", addToCart);
    </script>
</body>

</html>
