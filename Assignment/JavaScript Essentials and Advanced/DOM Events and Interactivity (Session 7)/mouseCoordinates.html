<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Co-ordinates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container mt-5 text-center">

        <h2 class="mb-4">Mouse Coordinates</h2>

        <div id="mouseBox" class="bg-primary text-white p-5 rounded" style="height: 300px;  cursor: pointer;">

            <h4>Click anywhere inside this box</h4>

            <p id="coordinates" class="mt-4">
                X: 0, Y: 0
            </p>

        </div>

    </div>

    <script>
        const mouseBox = document.querySelector("#mouseBox");
        const coordinates = document.querySelector("#coordinates");

        mouseBox.addEventListener("click", function (event) {

            const x = event.clientX;
            const y = event.clientY;

            coordinates.textContent = "X: " + x + ", Y: " + y;
        });
    </script>
</body>

</html>
