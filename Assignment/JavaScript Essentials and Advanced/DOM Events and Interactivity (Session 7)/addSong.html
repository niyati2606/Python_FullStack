<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to Song</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container text-center mt-5">

        <h1 class="mb-4">🎵 My Favorite Playlist</h1>

        <button onclick="addSong()" class="btn btn-success">
            Add Song
        </button>

        <div id="song-container" class="row justify-content-center mt-4 g-3">
        </div>

    </div>
    
    <script>
        const songs = [
            "Perfect - Ed Sheeran",
            "Blinding Lights - The Weeknd",
            "Levitating - Dua Lipa",
            "Shape of You - Ed Sheeran",
            "Stay - Justin Bieber"
        ];

        function addSong() {

            const randomIndex = Math.floor(Math.random() * songs.length);

            const randomSong = songs[randomIndex];

            document.getElementById("song-container").innerHTML += `
                <div class="col-md-3">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <h5 class="card-title">🎵 ${randomSong}</h5>
                            <p class="card-text text-muted">
                                Added to playlist
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>

</html>
