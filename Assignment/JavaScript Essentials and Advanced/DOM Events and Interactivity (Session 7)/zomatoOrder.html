<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container m-5 text-center col-md-3 card p-3"
        style="border-radius: 10px; background-color: rgb(247, 246, 246);">
        <h2 class="text-danger mb-4">
            Order Your Food 😋
        </h2>

        <div class="mb-3">
            <label for="cuisine" class="form-label" style="font-family: Verdana, Geneva, Tahoma, sans-serif;">
                Select Cuisine
            </label>

            <select id="cuisine" class="from-select" onchange="showCuisine()">
                <option value="">-- Select Cuisine --</option>
                <option value="Indian">Indian</option>
                <option value="Chinese">Chinese</option>
                <option value="Italian">Italian</option>
                <option value="Mexican">Mexican</option>
            </select>

            <div class="mb-3">
                <label for="quantity" class="form-label">
                    Quantity
                </label>

                <input type="number" id="quantity" class="form-control" min="1" placeholder="Enter Quantity" />
            </div>

            <div class="alert alert-success d-none" id="message">

            </div>

            <button class="btn btn-success" style="border-radius: 20px;">Order now</button>
        </div>
    </div>

    <script>

        function showCuisine() {
            const cuisine = document.getElementById("cuisine").value;
            const message = document.getElementById("message");

            if (cuisine != - "") {
                message.textContent = "You selected " + cuisine + " cuisine!";
                message.classList.remove("d-none");
            } else {
                message.classList.add("d-none");
            }
        }
    </script>
</body>

</html>
