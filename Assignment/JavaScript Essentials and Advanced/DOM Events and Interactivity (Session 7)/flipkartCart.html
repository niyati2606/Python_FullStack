<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <div class="container mt-5">

        <div class="card shadow mx-auto" style="max-width: 400px;">

            <div class="card-body text-center">

                <h3 class="mb-3">Smartphone</h3>

                <p class="text-muted">₹15,999</p>

                <button id="cartBtn" class="btn btn-warning w-100">
                    Add to Cart
                </button>

            </div>

        </div>

    </div>

    <script>
        const cartButton = document.querySelector("#cartBtn");

        function handleMouseEvent(event) {

            console.log("Event Type:", event.type);
            console.log("X Coordinate:", event.clientX);
            console.log("Y Coordinate:", event.clientY);

        }

        // Different mouse events
        cartButton.addEventListener("click", handleMouseEvent);
        cartButton.addEventListener("mouseover", handleMouseEvent);
        cartButton.addEventListener("mouseout", handleMouseEvent);
    </script>
</body>

</html>
