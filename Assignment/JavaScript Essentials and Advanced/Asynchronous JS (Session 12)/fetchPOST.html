<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Post</title>
</head>

<body>

    <h1>Fetch Post</h1>

    <script>
        try {
            fetch("https://jsonplaceholder.typicode.com/posts", {
                method: "GET"
            })
                .then((response) => {
                    return response.json()
                })
                .then(function (posts) {
                    console.log(posts)
                    const firstFive = posts.slice(0, 5);
                    firstFive.forEach(function (post, index) {
                        console.log(`${post.title}`);
                    });
                })
        } catch (err) {
            console.log("Error : ", err)
        }   
    </script>
</body>

</html>
