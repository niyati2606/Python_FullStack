<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Buttons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container mt-5 text-center">
        <h2 class="mb-4">My Spotify Playlist 🎵</h2>

        <div id="playlist"></div>
    </div>

    <script>
        function createPlaylistButton(songName, themeColor) {
            const button = document.createElement("button");

            button.textContent = songName;
            button.style.backgroundColor = themeColor;

            button.className = "btn text-white m-2 px-4 py-2 rounded-pill";

            return button;
        }

        document.getElementById("playlist").appendChild(
            createPlaylistButton("Perfect", "#1DB954")
        );

        document.getElementById("playlist").appendChild(
            createPlaylistButton("Shape of You", "#0d6efd")
        );

        document.getElementById("playlist").appendChild(
            createPlaylistButton("Believer", "#6f42c1")
        );
    </script>

</body>

</html>
