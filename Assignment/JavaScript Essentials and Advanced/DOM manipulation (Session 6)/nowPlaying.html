<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

    <div class="container text-center mt-5">
        <div class="card p-4 mx-auto" style="max-width: 400px;">
            <h2>🎵 Now Playing</h2>

            <h4 class="mt-3">
                <span id="song-title">Perfect</span>
            </h4>

            <button id="changeSong" class="btn btn-success mt-3">
                Change Song
            </button>
        </div>
    </div>

    <script>
        const songs = [
            "Perfect",
            "Shape of You",
            "Believer",
            "Blinding Lights",
            "Levitating"
        ];

        let index = 0;

        document.getElementById("changeSong").addEventListener("click", function () {
            index = (index + 1) % songs.length;

            document.getElementById("song-title").innerHTML = songs[index];
        });
    </script>


</body>

</html>
