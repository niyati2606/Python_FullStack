<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Song</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container mt-5">
        <h2>My Playlist 🎵</h2>

        <input type="text" id="songInput" class="form-control mb-3" placeholder="Enter song name">

        <button id="addSong" class="btn btn-success">
            Add Song
        </button>

        <ul id="playlist" class="list-group mt-4"></ul>
    </div>

    <script>
        document.querySelector("#addSong").addEventListener("click", function () {

            // Get input value using querySelector
            let songName = document.querySelector("#songInput").value;

            if (songName !== "") {
                // Create new li
                let li = document.createElement("li");

                // Add song name
                li.innerText = songName;

                // Bootstrap styling
                li.className = "list-group-item";

                // Add li to playlist
                document.querySelector("#playlist").appendChild(li);

                // Clear input
                document.querySelector("#songInput").value = "";
            }
        });
    </script>

</body>

</html>
