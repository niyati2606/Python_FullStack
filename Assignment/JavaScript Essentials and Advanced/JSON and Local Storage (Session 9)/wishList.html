<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container mt-5" style="max-width: 500px;">

        <h2 class="mb-4 text-center">My Wishlist</h2>

        <button class="btn btn-primary mb-3" onclick="setupWishlist()">Save Sample Wishlist</button>
        <button class="btn btn-outline-danger mb-3" onclick="clearWishlist()">Clear Wishlist</button>

        <ul id="list" class="list-group"></ul>

    </div>

    <script>
        function loadWishlist() {
            const saved = localStorage.getItem('wishlist');
            return saved ? JSON.parse(saved) : [];
        }

        function saveWishlist(data) {
            localStorage.setItem('wishlist', JSON.stringify(data));
        }

        function renderList() {
            const data = loadWishlist();
            const list = document.getElementById('list');
            list.innerHTML = '';

            if (data.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted">Your wishlist is empty.</li>';
                return;
            }

            data.forEach(product => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.innerHTML = `
          <span>${product.name}</span>
          <span class="badge bg-success rounded-pill">₹${product.price}</span>
        `;
                list.appendChild(li);
            });
        }

        // Creates 3 sample products and saves them to localStorage as 'wishlist'
        function setupWishlist() {
            const wishlist = [
                { name: 'Wireless Earbuds', price: 1499 },
                { name: 'Smart Watch', price: 2999 },
                { name: 'Bluetooth Speaker', price: 1199 }
            ];
            saveWishlist(wishlist);
            renderList();
        }

        // Removes the 'wishlist' key from localStorage and updates the display
        function clearWishlist() {
            localStorage.removeItem('wishlist');
            renderList();
        }

        // Load and display whatever is already saved when the page opens
        renderList();
    </script>

</body>

</html>
