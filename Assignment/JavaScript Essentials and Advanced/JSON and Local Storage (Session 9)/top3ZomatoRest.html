<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 3 Zomato Restaurants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container mt-5" style="max-width: 500px;">

        <h2 class="mb-4 text-center">My Top 3 Favorite Zomato Restaurants</h2>
        <div class="input-group mb-2">
            <input type="text" id="restaurantInput" class="form-control" placeholder="Enter restaurant name">
            <button class="btn btn-danger" onclick="addRestaurant()">Add</button>
        </div>

        <ul id="list" class="list-group mt-3"></ul>

        <button class="btn btn-outline-secondary btn-sm mt-3" onclick="clearFavorites()">Clear Favorites</button>

    </div>

    <script>
        function loadRestaurants() {
            const saved = localStorage.getItem('topRestaurants');
            return saved ? JSON.parse(saved) : [];
        }

        function saveRestaurants(data) {
            localStorage.setItem('topRestaurants', JSON.stringify(data));
        }

        function renderList() {
            const data = loadRestaurants();
            const list = document.getElementById('list');
            list.innerHTML = '';

            if (data.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted">No restaurants added yet.</li>';
            } else {
                data.forEach((name, index) => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.innerHTML = `
            <span>${index + 1}. ${name}</span>
            <button class="btn btn-sm btn-outline-danger" onclick="removeRestaurant(${index})">Remove</button>
          `;
                    list.appendChild(li);
                });
            }

        }

        function addRestaurant() {
            const input = document.getElementById('restaurantInput');
            const name = input.value.trim();
            if (!name) return;

            const data = loadRestaurants();
            if (data.length >= 3) return;

            data.push(name);
            saveRestaurants(data);
            input.value = '';
            renderList();
        }

        function removeRestaurant(index) {
            const data = loadRestaurants();
            data.splice(index, 1);
            saveRestaurants(data);
            renderList();
        }

        function clearFavorites() {
            localStorage.removeItem('topRestaurants');
            renderList();
        }

        // Load saved list when the page opens
        renderList();
    </script>

</body>

</html>
