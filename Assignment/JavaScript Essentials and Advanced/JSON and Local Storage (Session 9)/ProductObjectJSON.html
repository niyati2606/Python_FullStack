<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Object JSON</title>
</head>

<body>
  <h1>Product Object JSON</h1>

  <script>

    const product = {
      name: "Samsung Galaxy M14 5G",
      price: 12999,
      rating: 4.3
    };

    const productJSON = JSON.stringify(product);
    console.log(productJSON);

  </script>
</body>

</html>
