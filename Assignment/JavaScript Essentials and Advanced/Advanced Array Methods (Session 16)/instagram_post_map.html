<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
</head>

<body>
    <h2>Instagram Post - Map Method</h2>

    <script>
        const posts = [
            { username: "niya26", likes: 120 },
            { username: "sa18", likes: 250 },
            { username: "niyati26", likes: 180 },
            { username: "ns23", likes: 320 }
        ]

        const likeCounts = posts.map(post => post.likes)

        console.log(likeCounts)
    </script>
</body>

</html>
