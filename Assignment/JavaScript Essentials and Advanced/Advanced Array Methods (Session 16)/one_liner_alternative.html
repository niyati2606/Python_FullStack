<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>one-liner alternative</title>
</head>

<body>
    <h2>one-liner alternative map and reduce method</h2>

    <script>
        const transactions = [
            { description: "Shopping", amount: 1200 },
            { description: "Food", amount: 500 },
            { description: "Travel", amount: 800 },
            { description: "Movies", amount: 300 }
        ]

        const totalSpent = transactions
            .map(transaction => transaction.amount)
            .reduce((total, amount) => total + amount, 0)

        console.log("Total Amount Spent: ₹" + totalSpent)
    </script>
</body>

</html>
