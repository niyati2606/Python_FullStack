<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator</title>
</head>

<body>
    <h1>Spread Operator</h1>

    <script>
        const cricketFans = ['Virat', 'Rohit']
        const footballFans = ['Messi', 'Ronaldo']

        let fans = [...cricketFans, ...footballFans]
        console.log("Spread Data : ", fans)
    </script>
</body>

</html>
