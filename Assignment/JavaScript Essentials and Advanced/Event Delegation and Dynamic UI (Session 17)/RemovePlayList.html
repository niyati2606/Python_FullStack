<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container py-5">

        <h2 class="text-center mb-4">My Playlist</h2>

        <!-- Parent Container -->
        <div id="songContainer" class="row g-3">

            <!-- Song Card -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Blinding Lights</h5>
                        <button class="btn btn-danger btn-sm remove-song">
                            X
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Shape of You</h5>
                        <button class="btn btn-danger btn-sm remove-song">
                            X
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Perfect</h5>
                        <button class="btn btn-danger btn-sm remove-song">
                            X
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Levitating</h5>
                        <button class="btn btn-danger btn-sm remove-song">
                            X
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>

        // Event delegation
        const songContainer = document.getElementById("songContainer");

        songContainer.addEventListener("click", function (event) {

            // Check if X button was clicked
            if (event.target.classList.contains("remove-song")) {

                // Remove the complete card column
                event.target.closest(".col-md-4").remove();
            }

        });

    </script>

</body>

</html>
