<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Stories</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h3 class="mb-4">Instagram Stories</h3>

    <!-- Parent Container -->
    <div id="storiesContainer" class="d-flex gap-3">

        <!-- Story Card -->
        <div class="card story-card" style="width: 150px;">
            <img src="https://picsum.photos/150/150?random=1"
                 class="card-img-top">
            <div class="card-body text-center">
                <h6>Story 1</h6>
                <button class="btn btn-danger btn-sm remove-btn">
                    Remove
                </button>
            </div>
        </div>

        <!-- Story Card -->
        <div class="card story-card" style="width: 150px;">
            <img src="https://picsum.photos/150/150?random=2"
                 class="card-img-top">
            <div class="card-body text-center">
                <h6>Story 2</h6>
                <button class="btn btn-danger btn-sm remove-btn">
                    Remove
                </button>
            </div>
        </div>

        <!-- Story Card -->
        <div class="card story-card" style="width: 150px;">
            <img src="https://picsum.photos/150/150?random=3"
                 class="card-img-top">
            <div class="card-body text-center">
                <h6>Story 3</h6>
                <button class="btn btn-danger btn-sm remove-btn">
                    Remove
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    // Only ONE event listener for all story cards
    const storiesContainer = document.getElementById("storiesContainer");

    storiesContainer.addEventListener("click", function(event) {

        // Check if the clicked element is a Remove button
        if (event.target.classList.contains("remove-btn")) {

            // Find the story card containing the button
            const storyCard = event.target.closest(".story-card");

            // Remove that story card
            storyCard.remove();
        }
    });
</script>

</body>
</html>
