<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .product-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="mb-4">🛒 My Shopping Cart</h2>

        <!-- Parent Cart Container -->
        <div id="cartContainer">

            <!-- Product Card 1 -->
            <div class="card mb-3 shadow-sm cart-item" data-price="69999" data-qty="1">
                <div class="card-body">
                    <div class="row align-items-center">

                        <div class="col-4 col-md-2">
                            <img src="https://cdn.grofers.com/cdn-cgi/image/f=auto,fit=scale-down,q=85,metadata=none,w=120,h=120/da/cms-assets/cms/product/2d0a7920-aad0-4cd2-be5a-d40e50f634c8.jpg"
                                class="product-img rounded" alt="iPad">
                        </div>

                        <div class="col-8 col-md-6">
                            <h5>iPad</h5>
                            <p class="text-muted mb-1">128GB | Black</p>
                            <h5 class="text-success">₹69,999</h5>
                        </div>

                        <div class="col-8 col-md-3 mt-3 mt-md-0">
                            <button class="btn btn-outline-secondary btn-sm" data-action="dec">−</button>
                            <span class="mx-2 fw-semibold qty">1</span>
                            <button class="btn btn-outline-secondary btn-sm" data-action="inc">+</button>
                        </div>

                        <div class="col-4 col-md-1 text-end mt-3 mt-md-0">
                            <button class="btn-close remove-btn" aria-label="Remove item"></button>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Product Card 2 -->
            <div class="card mb-3 shadow-sm cart-item" data-price="74999" data-qty="1">
                <div class="card-body">
                    <div class="row align-items-center">

                        <div class="col-4 col-md-2">
                            <img src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcSwE3wav7VMcnklsHAH1UGxWc8mjU4hKGd1lBJbNQ8Acl2D09YTauHPEu9bKNHhlZuU3dtHHHzFjJEryKJSriQP9AMm7n5ow9hhqYfyswX5P_PllaTQnfR_TQ"
                                class="product-img rounded" alt="Samsung Galaxy S25">
                        </div>

                        <div class="col-8 col-md-6">
                            <h5>Samsung Galaxy S25</h5>
                            <p class="text-muted mb-1">256GB | Blue</p>
                            <h5 class="text-success">₹74,999</h5>
                        </div>

                        <div class="col-8 col-md-3 mt-3 mt-md-0">
                            <button class="btn btn-outline-secondary btn-sm" data-action="dec">−</button>
                            <span class="mx-2 fw-semibold qty">1</span>
                            <button class="btn btn-outline-secondary btn-sm" data-action="inc">+</button>
                        </div>

                        <div class="col-4 col-md-1 text-end mt-3 mt-md-0">
                            <button class="btn-close remove-btn" aria-label="Remove item"></button>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Product Card 3 -->
            <div class="card mb-3 shadow-sm cart-item" data-price="9999" data-qty="1">
                <div class="card-body">
                    <div class="row align-items-center">

                        <div class="col-4 col-md-2">
                            <img src="https://www.sony.co.in/image/5d02da5df552836db894cead8a68f5f3?fmt=png-alpha"
                                class="product-img rounded" alt="Sony Wireless Headphones">
                        </div>

                        <div class="col-8 col-md-6">
                            <h5>Sony Wireless Headphones</h5>
                            <p class="text-muted mb-1">Noise Cancelling | Black</p>
                            <h5 class="text-success">₹9,999</h5>
                        </div>

                        <div class="col-8 col-md-3 mt-3 mt-md-0">
                            <button class="btn btn-outline-secondary btn-sm" data-action="dec">−</button>
                            <span class="mx-2 fw-semibold qty">1</span>
                            <button class="btn btn-outline-secondary btn-sm" data-action="inc">+</button>
                        </div>

                        <div class="col-4 col-md-1 text-end mt-3 mt-md-0">
                            <button class="btn-close remove-btn" aria-label="Remove item"></button>
                        </div>

                    </div>
                </div>
            </div>

        </div>

        <!-- Empty state -->
        <p id="emptyMsg" class="text-muted text-center d-none">Your cart is empty.</p>

        <!-- Cart Summary -->
        <div class="card shadow-sm mt-4">
            <div class="card-body d-flex justify-content-between align-items-center">
                <h5 class="mb-0" id="total">Total: ₹0</h5>

                <button class="btn btn-warning px-4" id="orderBtn">
                    Place Order
                </button>
            </div>
        </div>

    </div>


    <script>

        // Parent container
        const cartContainer = document.getElementById("cartContainer");

        // Recalculate total (price × qty) and toggle empty state
        function updateTotal() {
            const items = cartContainer.querySelectorAll(".cart-item");
            let sum = 0;

            items.forEach(item => {
                sum += Number(item.dataset.price) * Number(item.dataset.qty);
            });

            document.getElementById("total").textContent =
                "Total: ₹" + sum.toLocaleString("en-IN");

            document.getElementById("emptyMsg").classList.toggle("d-none", items.length > 0);
            document.getElementById("orderBtn").disabled = items.length === 0;
        }

        // One listener on the parent
        cartContainer.addEventListener("click", function (event) {

            const cartItem = event.target.closest(".cart-item");
            if (!cartItem) return;

            // Remove
            if (event.target.classList.contains("remove-btn")) {
                cartItem.remove();
            }

            // Quantity + / −
            const action = event.target.dataset.action;
            if (action) {
                let qty = Number(cartItem.dataset.qty);
                qty = action === "inc" ? qty + 1 : Math.max(1, qty - 1);

                cartItem.dataset.qty = qty;
                cartItem.querySelector(".qty").textContent = qty;
            }

            updateTotal();
        });

        // Initial total
        updateTotal();

    </script>

</body>

</html>
