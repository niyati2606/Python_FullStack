<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart Wishlist</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>💙 My Wishlist</h2>

            <button id="addProduct" class="btn btn-primary">
                + Add Product
            </button>
        </div>

        <!-- Product List -->
        <div id="productList" class="row g-4">

            <!-- Product 1 -->
            <div class="col-md-4 product-card">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">iPhone 16</h5>
                        <p class="text-muted">128GB Smartphone</p>
                        <h5 class="text-success">₹69,999</h5>

                        <button class="btn btn-danger remove-btn mt-2">
                            Remove
                        </button>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-md-4 product-card">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Samsung Galaxy S25</h5>
                        <p class="text-muted">256GB Smartphone</p>
                        <h5 class="text-success">₹74,999</h5>

                        <button class="btn btn-danger remove-btn mt-2">
                            Remove
                        </button>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-md-4 product-card">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Sony Headphones</h5>
                        <p class="text-muted">Wireless Noise Cancelling</p>
                        <h5 class="text-success">₹9,999</h5>

                        <button class="btn btn-danger remove-btn mt-2">
                            Remove
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>

        // Parent container
        const productList = document.getElementById("productList");

        // Add Product button
        const addProduct = document.getElementById("addProduct");

        // Event delegation
        // One listener handles ALL Remove buttons
        productList.addEventListener("click", function(event) {

            if (event.target.classList.contains("remove-btn")) {

                // Find the product card and remove it
                const productCard = event.target.closest(".product-card");

                productCard.remove();
            }
        });


        // Add new product dynamically
        addProduct.addEventListener("click", function() {

            const product = document.createElement("div");

            product.className = "col-md-4 product-card";

            product.innerHTML = `
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">New Flipkart Product</h5>
                        <p class="text-muted">Newly Added Product</p>
                        <h5 class="text-success">₹4,999</h5>

                        <button class="btn btn-danger remove-btn mt-2">
                            Remove
                        </button>
                    </div>
                </div>
            `;

            productList.appendChild(product);
        });

    </script>

</body>
</html>
