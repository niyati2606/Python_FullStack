<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status</title>
</head>

<body>
    <h1>Order Status</h1>

    <script>
        function getOrderStatus(orderId) {
            return new Promise(function (resolve, reject) {

                setTimeout(function () {
                    if (orderId % 2 === 0) {
                        resolve("Order delivered");
                    } else {
                        reject("Order not found");
                    }
                }, 1500);

            });
        }

        // Test with an even order ID
        getOrderStatus(102)
            .then(function (result) {
                console.log(result);
            })
            .catch(function (error) {
                console.log(error);
            });

        // Test with an odd order ID
        getOrderStatus(103)
            .then(function (result) {
                console.log(result);
            })
            .catch(function (error) {
                console.log(error);
            });        
    </script>
</body>

</html>
