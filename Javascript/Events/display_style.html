<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change CSS on Button</title>
</head>

<body>

    <h1 id="h1_data">Demo of Change CSS on button click</h1>

    <button onclick="changeCSS()">Change CSS</button>

    <script>

        let h1_tag = document.getElementById("h1_data")

        function changeCSS() {
            h1_tag.style.background = "blue"
            h1_tag.style.color = "white"
            h1_tag.style.padding = "30px"
            h1_tag.style.fontSize = "40px"
        }

    </script>

</body>

</html>
