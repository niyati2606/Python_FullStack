<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change CSS</title>
    <style>
        .main {
            padding: 50px;
            font-size: 50px;
            font-weight: bold;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri , 'Trebuchet MS', sans-serif;
            background: linear-gradient(#bb6222, #bb22aa, #ab3231, #5b47df);
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

    <button onclick="addCSS()">Add CSS</button>
    <button onclick="removeCSS()">Remove CSS</button>
    <button onclick="toogleCSS()">Toogle CSS</button>
    <br>
    <br>
    <div id="main">Demo of add remove and toogle css</div>

    <script>
        
        let main_tag = document.getElementById("main")

        function addCSS(){
            main_tag.classList.add("main")
        }

        function removeCSS(){
            main_tag.classList.remove("main")
        }

        function toogleCSS(){
            main_tag.classList.toggle("main")
        }

    </script>

</body>

</html>
