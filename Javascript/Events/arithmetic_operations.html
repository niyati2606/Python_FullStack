<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic</title>
</head>

<body>

    <input type="text" placeholder="Enter Number" id="num1" value=""><br><br>
    <input type="text" placeholder="Enter Number" id="num2" value=""><br><br>

    <h2 id="ans_h2"></h2>

    <button onclick="add()">Sum</button>
    <button onclick="sub()">subtraction</button>
    <button onclick="mul()">Multiplication</button>

    <script>

        let num1 = document.getElementById("num1")
        let num2 = document.getElementById("num2")

        function add() {
            let ans = parseInt(num1.value) + parseInt(num2.value)
            document.getElementById("ans_h2").innerHTML = "Sum :" + ans
        }

        function sub() {
            let ans = parseInt(num1.value) - parseInt(num2.value)
            document.getElementById("ans_h2").innerHTML = "Subtraction :" + ans
        }

        function mul() {
            let ans = parseInt(num1.value) * parseInt(num2.value)
            document.getElementById("ans_h2").innerHTML = "Multiplication :" + ans
        }

    </script>

</body>

</html>
