<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Pattern</title>
</head>

<body>

    <script>
        for (let r = 5; r >= 1; r--) {
            for (let s = 1; s <= 5 - r; s++) {
                document.writeln("&nbsp;&nbsp;")
            }
            for (let c = 1; c <= r; c++) {
                document.writeln("*")
            }
            document.writeln("<br>")
        }
    </script>

</body>

</html>

    * * * * *

        * * *
          * *
            *
-->
