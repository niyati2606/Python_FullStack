<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find max from 3</title>
</head>
<body>
    <script>

        let a = 250
        let b = 30
        let c = 280

        if (a > b) {
            if(a > c){
                console.log("A is Max")
            }else{
                console.log("C is Max")
            }
        }else if(b > c){
            console.log("B is Max")
        }else{
            console.log("C is Max")
        }

    </script>
</body>
