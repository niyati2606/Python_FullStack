<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd Even</title>
</head>
<body>
    <script>

        let num = 0

        if(num % 2 == 0 && num == 0){
            console.log("Number is Even")
        }else{
            console.log("Number is Odd")
        }

    </script>
</body>
</html>
