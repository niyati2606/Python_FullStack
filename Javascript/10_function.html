<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>

<body>

    <!--
        2 types of function
            1) in-built functions
            2) user define functions
                1) with parameter
                2) without parameter

        function is keyword for creating user define function
    -->

    <script>

        //without para
        function printName(){
            console.log("Hello Niya..")
        }

        printName()

        //with para
        function add(x,y){
            console.log("Sum :", x+y)
        }

        add(5,10)

        //with return type --its not type of function
        function mul(x,y){
            return x*y
        }

        console.log("Multiplication :", mul(22,5))

    </script>
</body>

</html>
