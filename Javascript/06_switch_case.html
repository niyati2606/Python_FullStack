<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case</title>
</head>

<body>
    <script>

        let a = 20;
        let b = 10
        let choice = "+"

        switch (choice) {
            case "+":
                console.log("sum :", a + b);
                break;

            case "-":
                console.log("Sub :", a - b)
                break

            case "*":
                console.log("mul :", a * b)
                break
            case "/":
                console.log("div :", a / b)
                break

            default:
                console.log("Invalid choice")
        }

    </script>
</body>

</html>
