<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Form</title>
    <style>
        table {
            background-color: cadetblue;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        td {
            padding: 4px 8px;
        }
    </style>
</head>

<body>
    <table align="center">
        <caption>Login</caption>
        <form action="">
            <tr>
                <td><label for=""><label for="">Enter First name</label></label></td>
                <td><input type="text" placeholder="Enter First name" value=""></td>
            </tr>
            <tr>
                <td><label for=""><label for="">Enter Last name</label></label></td>
                <td><input type="text" placeholder="Enter Last name" value=""></td>
            </tr>
            <tr>
                <td><label for=""><label for="">Enter Email</label></label></td>
                <td><input type="email" placeholder="Enter Email" value=""></td>
            </tr>
            <tr>
                <td><label for=""><label for="">Enter Mobile Number</label></label></td>
                <td><input type="tel" placeholder="Enter Mobile Number" value=""></td>
            </tr>
            <tr>
                <td><label for=""><label for="">Enter Password</label></label></td>
                <td><input type="password" placeholder="Enter Password" value=""></td>
            </tr>
            <tr>
                <td><label for="">Select Gender</label></td>
                <td> <input type="radio" name="nm"> Male
                    <input type="radio" name="nm"> Female
                    <input type="radio" name="nm"> Other
                </td>
            </tr>
            <tr>
                <td><label for="">Select Subject</label></td>
                <td>
                    <input type="checkbox"> C
                    <input type="checkbox"> C++
                    <input type="checkbox"> Database
                    <input type="checkbox"> Python <br>
                    <input type="checkbox"> Java
                    <input type="checkbox"> Html
                </td>
            </tr>
        </form>
    </table>
</body>

</html>
