<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border CSS</title>
    <style>
        .main{
            height: 300px;
            width: 300px;
            border: 10px double blue;
        }
    </style>
</head>

<body>
    <h1 style="border: 5px solid green;">Solid Border</h1>

    <h1 style="border: 5px dashed green;">Dashed Border</h1>

    <h1 style="border: 5px double green;">Double Border</h1>

    <h1 style="border: 5px ridge green;">Ridge Border</h1>

    <h1 style="border: 5px inset green;">Inset Border</h1>

    <h1 style="border: 5px outset green;">Outset Border</h1>

    <h1 style="border-top: 5px double green;">Dashed Top Border</h1>

    <h1 style="border-bottom: 5px double green;">Dashed Bottom Border</h1>
    
    <div class="main">
        box
    </div>
</body>

</html>
